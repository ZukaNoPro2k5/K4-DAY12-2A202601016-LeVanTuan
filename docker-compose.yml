# ═══════════════════════════════════════════════════════════════════
# CP2 — Stack chạy ở máy bạn: chat + redis (+ nginx nếu làm phần cộng điểm)
#
# Service `redis` đã cho sẵn — chạy ngay từ Block 1 để có Redis mà code:
#     docker compose up -d redis
#
# NHIỆM VỤ: bổ sung service `chat`. Yêu cầu:
#   [ ] build từ Dockerfile trong thư mục hiện tại
#   [ ] map cổng ra ngoài (8000:8000)
#   [ ] KHÔNG viết secret thẳng vào file này — dùng nội suy biến môi trường
#       `${API_TOKEN}` (docker compose tự đọc từ file .env cùng thư mục)
#   [ ] REDIS_URL trỏ tới `redis://redis:6379/0` — trong compose, tên service
#       chính là hostname
#   [ ] depends_on: redis
#   [ ] healthcheck gọi /healthz
#
# ĐIỂM CỘNG: thêm service `nginx` làm load balancer (nginx/nginx.conf đã có sẵn)
#     docker compose up --scale chat=3
#
# Kiểm tra: pytest tests/test_cp2.py -v
# ═══════════════════════════════════════════════════════════════════

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Khai báo service chat
  chat:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Lấy giá trị từ file .env ở máy host
      API_TOKEN: ${API_TOKEN}
      # Sử dụng hostname của service redis trong cùng stack
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')\" || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
